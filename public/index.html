<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Tech</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://js.stripe.com/v3/"></script>
</head>

<body>

    <header>
        <h1>Loja Tech</h1>
    </header>

    <main class="produtos">

        <!-- SMARTPHONE -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=1200&auto=format&fit=crop"
                alt="Smartphone">

            <h2>Smartphone</h2>

            <p>R$ 1.999,00</p>

            <button onclick="comprar('Smartphone',199900)">
                Comprar
            </button>
        </div>

        <!-- SMARTWATCH -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1200&auto=format&fit=crop"
                alt="Smartwatch">

            <h2>Smartwatch</h2>

            <p>R$ 599,00</p>

            <button onclick="comprar('Smartwatch',59900)">
                Comprar
            </button>
        </div>

        <!-- FONE -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?q=80&w=1200&auto=format&fit=crop"
                alt="Fone Bluetooth">

            <h2>Fone Bluetooth</h2>

            <p>R$ 299,00</p>

            <button onclick="comprar('Fone Bluetooth',29900)">
                Comprar
            </button>
        </div>

    </main>

    <script>
        function comprar(produto) {
            alert("Você comprou: " + produto);
        }
    </script>

</body>

</html>
